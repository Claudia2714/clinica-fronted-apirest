<div class="login-page">
  <div class="login-card">
    <!-- Encabezado con Identidad Clínica -->
    <div class="login-header">
      <div class="brand-icon">🏥</div>
      <h1>Clínica Médica</h1>
      <p class="subtitle">Portal de Gestión y Acceso Seguro</p>
    </div>

    <!-- Formulario de Acceso -->
    <form (ngSubmit)="iniciarSesion()" class="login-form">
      <!-- Campo Usuario -->
      <div class="form-field">
        <label for="username">Usuario del Sistema</label>
        <div class="input-wrapper">
          <span class="field-icon">👤</span>
          <input
            id="username"
            type="text"
            [(ngModel)]="credenciales.username"
            name="username"
            placeholder="Ingresa tu usuario"
            autocomplete="username"
            required
          />
        </div>
      </div>

      <!-- Campo Contraseña -->
      <div class="form-field">
        <label for="password">Contraseña</label>
        <div class="input-wrapper">
          <span class="field-icon">🔒</span>
          <input
            id="password"
            type="password"
            [(ngModel)]="credenciales.password"
            name="password"
            placeholder="••••••••"
            autocomplete="current-password"
            required
          />
        </div>
      </div>

      <!-- Widget de Cloudflare Turnstile -->
      <div class="turnstile-container">
        <div
          class="cf-turnstile"
          [attr.data-sitekey]="turnstileSiteKey"
          data-callback="onCaptchaResolved"
          data-expired-callback="onCaptchaExpired"
          data-theme="light">
        </div>
      </div>

      <!-- Mensaje de Alerta / Error -->
      <div *ngIf="error" class="alert-box">
        <span class="alert-icon">⚠️</span>
        <span class="alert-text">{{ errorMsg }}</span>
      </div>

      <!-- Botón de Envío -->
      <button
        type="submit"
        class="btn-login"
        [disabled]="cargando">
        <span *ngIf="!cargando" class="btn-content">
          <span>Ingresar a la Plataforma</span>
          <span class="btn-arrow">→</span>
        </span>
        <span *ngIf="cargando" class="loading-content">
          <span class="spinner"></span>
          <span>Verificando credenciales...</span>
        </span>
      </button>
    </form>

    <!-- Pie Informativo de Seguridad -->
    <div class="login-footer">
      <div class="security-badges">
        <span>🛡️ Rate Limiting Activo</span>
        <span>•</span>
        <span>🔐 JWT RS256</span>
      </div>
      <p class="footer-note">Acceso restringido a personal autorizado.</p>
    </div>
  </div>
</div>
