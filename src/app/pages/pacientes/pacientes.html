<div class="page-container">
  <div class="header-section">
    <h2>🩺 Consultar Pacientes</h2>
    <button class="btn-primary">+ Nuevo Paciente</button>
  </div>
  <div class="table-card">
    <table class="modern-table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Nombres</th>
          <th>Apellidos</th>
          <th>Teléfono</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let paciente of pacientes">
          <td>{{ paciente.idPaciente }}</td>
          <td>{{ paciente.nombres }}</td>
          <td>{{ paciente.apellidos }}</td>
          <td>{{ paciente.telefono }}</td>
          <td><button class="btn-action">Ver</button></td>
        </tr>
        <tr *ngIf="pacientes.length === 0">
          <td colspan="5" style="text-align: center; color: #7f8c8d; padding: 20px;">
            No hay pacientes registrados o cargando datos...
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
