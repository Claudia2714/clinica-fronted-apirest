services:
  # ── Frontend: Aplicación Angular en Render (Static Site) ──
  - type: web
    name: clinica-frontend
    runtime: static
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    staticPublishPath: dist/clinica-frontend/browser
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

